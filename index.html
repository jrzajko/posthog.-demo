<head>
<meta charset="UTF-8">
<title>Ulala Produce Pantry — Demo</title>

<style>
  body { font-family: -apple-system, Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 22px; }
  .product { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .product:hover { background: #fafafa; }
  .product h3 { margin: 0 0 4px 0; }
  .product p { margin: 0; color: #666; font-size: 14px; }
  button { background: #111; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:hover { background: #333; }
  #cart-bar { position: sticky; top: 0; background: #f5f5f0; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
  #checkout-section, #confirmation-section, #pdp-section { display: none; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-top: 20px; }
  #confirmation-section { text-align: center; }
  .back-link { display: inline-block; margin-bottom: 12px; color: #666; cursor: pointer; font-size: 14px; }
</style>
</head>
<body>

<h1>🥬 Ulala Produce Pantry</h1>

<div id="cart-bar">
  <span id="cart-count">Cart: 0 items</span>
  <button id="checkout-btn" onclick="showCheckout()">Checkout</button>
</div>

<div id="products">
  <div class="product" data-name="Heirloom Tomatoes" data-price="4.50" onclick="showProductDetail(this)">
    <div>
      <h3>Heirloom Tomatoes</h3>
      <p>£4.50 / box</p>
    </div>
    <button onclick="event.stopPropagation(); addToCart(this)">Add to cart</button>
  </div>

  <div class="product" data-name="Organic Kale" data-price="2.80" onclick="showProductDetail(this)">
    <div>
      <h3>Organic Kale</h3>
      <p>£2.80 / bunch</p>
    </div>
    <button onclick="event.stopPropagation(); addToCart(this)">Add to cart</button>
  </div>

  <div class="product" data-name="Fresh Sourdough" data-price="5.20" onclick="showProductDetail(this)">
    <div>
      <h3>Fresh Sourdough</h3>
      <p>£5.20 / loaf</p>
    </div>
    <button onclick="event.stopPropagation(); addToCart(this)">Add to cart</button>
  </div>
</div>

<div id="pdp-section">
  <span class="back-link" onclick="backToList()">← Back to products</span>
  <h2 id="pdp-name"></h2>
  <p id="pdp-price"></p>
  <p>Fresh, locally sourced, and delivered within 24 hours.</p>
  <button onclick="addToCartFromPDP()">Add to cart</button>
</div>

<div id="checkout-section">
  <h2>Checkout</h2>
  <p>Items in cart: <span id="checkout-count">0</span></p>
  <button onclick="submitOrder()">Place order</button>
</div>

<div id="confirmation-section">
  <h2>✅ Order confirmed!</h2>
  <p>Thanks for shopping with Produce Pantry.</p>
</div>

<script>
    let cartCount = 0;
  let currentPDPProduct = null;

  // Feature flag: checkout button variant test
  const checkoutVariant = posthog.getFeatureFlag('checkout-button-color');
  const checkoutBtn = document.getElementById('checkout-btn');

  if (checkoutVariant === 'test') {
    checkoutBtn.style.backgroundColor = '#2563eb';
    checkoutBtn.textContent = 'Buy Now';
  }

  function showProductDetail(productEl) {
  let cartCount = 0;
  let currentPDPProduct = null;

  function showProductDetail(productEl) {
    currentPDPProduct = productEl;
    const name = productEl.dataset.name;
    const price = productEl.dataset.price;

    document.getElementById('products').style.display = 'none';
    document.getElementById('pdp-name').textContent = name;
    document.getElementById('pdp-price').textContent = `£${price}`;
    document.getElementById('pdp-section').style.display = 'block';

    posthog.capture('product_viewed', {
      product_name: name,
      price: price
    });
  }

  function backToList() {
    document.getElementById('pdp-section').style.display = 'none';
    document.getElementById('products').style.display = 'block';
  }

  function addToCart(btn) {
    const product = btn.closest('.product');
    trackAddToCart(product.dataset.name, product.dataset.price);
  }

  function addToCartFromPDP() {
    trackAddToCart(currentPDPProduct.dataset.name, currentPDPProduct.dataset.price);
  }

  function trackAddToCart(name, price) {
    cartCount++;
    document.getElementById('cart-count').textContent = `Cart: ${cartCount} items`;

    posthog.capture('product_added_to_cart', {
      product_name: name,
      price: price
    });
  }

  function showCheckout() {
    document.getElementById('checkout-section').style.display = 'block';
    document.getElementById('checkout-count').textContent = cartCount;
    document.getElementById('checkout-section').scrollIntoView({ behavior: 'smooth' });

    posthog.capture('checkout_started', {
      cart_size: cartCount
    });
  }

  function submitOrder() {
    document.getElementById('checkout-section').style.display = 'none';
    document.getElementById('confirmation-section').style.display = 'block';

    posthog.capture('order_completed', {
      cart_size: cartCount
    });
  }
</script>

</body>
</html>
